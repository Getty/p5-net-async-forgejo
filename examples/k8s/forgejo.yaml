---
apiVersion: v1
kind: Service
metadata:
  name: forgejo-demo
  labels:
    app: forgejo-demo
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: web
    - port: 2222
      targetPort: 2222
      name: ssh
  selector:
    app: forgejo-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-demo
  labels:
    app: forgejo-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-demo
  template:
    metadata:
      labels:
        app: forgejo-demo
    spec:
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:1.21
          ports:
            - containerPort: 3000
              name: web
            - containerPort: 2222
              name: ssh
          env:
            - name: FORGEJO__database__DB_TYPE
              value: sqlite3
            - name: FORGEJO__database__PATH
              value: /data/forgejo.db
            - name: FORGEJO__server__DOMAIN
              value: forgejo-demo
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            - name: FORGEJO__server__SSH_PORT
              value: "2222"
            - name: FORGEJO__server__ROOT_URL
              value: http://forgejo-demo:3000/
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__admin__DEFAULT_KEEP_EMAIL_PRIVATE
              value: "true"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
